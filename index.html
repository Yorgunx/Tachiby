<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0c0c">
<title>TACHI</title>
<style>
  :root {
    --bg: #0c0c0c;
    --pink: #ff69b4;
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }
  body {
    font-family: Consolas, "Cascadia Mono", "Courier New", monospace;
    color: var(--white);
  }

  /* Arka plan: akan harfler */
  #rain {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: .5;
  }
  /* Kenarlara doğru kararan perde */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, rgba(12,12,12,.55) 0%, rgba(12,12,12,0) 45%),
      radial-gradient(ellipse at center, rgba(12,12,12,0) 40%, rgba(12,12,12,.85) 100%);
  }

  .stage {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 3vw, 30px);
    padding: 24px 12px;
  }

  pre {
    margin: 0;
    line-height: 1.05;
    white-space: pre;
    transform: translateX(110vw);
    animation: slide 1.8s cubic-bezier(.16, .8, .3, 1) forwards;
  }
  @keyframes slide { to { transform: translateX(0); } }

  #title {
    font-size: clamp(5px, 1.9vw, 22px);
    font-weight: 700;
    display: inline-block;
    background: linear-gradient(90deg, var(--pink), var(--white));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(255,105,180,.35));
    animation-delay: .2s;
  }
  .line {
    font-size: clamp(10px, 2.2vw, 24px);
    letter-spacing: .04em;
    line-height: 1.4;
    text-shadow: 0 0 10px rgba(255,105,180,.25);
  }
  .line b { color: var(--pink); font-weight: 400; }
  #o1 { animation-delay: 1.6s; }
  #o2 { animation-delay: 2.4s; }
  #dv { animation-delay: 3.2s; }

  /* Giriş ekranı: müzik tarayıcıda ancak bir tıklamadan sonra çalabilir */
  body:not(.go) pre { animation-play-state: paused; }
  #gate {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: rgba(12,12,12,.88);
    color: var(--pink);
    font-size: clamp(12px, 2.4vw, 26px);
    letter-spacing: .35em;
    text-shadow: 0 0 12px rgba(255,105,180,.7);
    transition: opacity .8s ease, visibility .8s ease;
    user-select: none;
  }
  #gate span { animation: pulse 1.8s ease-in-out infinite; padding-left: .35em; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  #gate.out { opacity: 0; visibility: hidden; pointer-events: none; }

  /* Müzik aç/kapat düğmesi */
  #mute {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 20;
    font: inherit;
    font-size: 13px;
    letter-spacing: .12em;
    color: var(--white);
    background: rgba(12,12,12,.6);
    border: 1px solid var(--pink);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: none;
    box-shadow: 0 0 12px rgba(255,105,180,.35);
    transition: background .2s, box-shadow .2s;
  }
  #mute:hover { background: rgba(255,105,180,.2); box-shadow: 0 0 18px rgba(255,105,180,.6); }
  #mute[hidden] { display: none; }
  @media (pointer: coarse) { #mute { cursor: pointer; } }

  /* Tıklayınca çıkan parçacıklar */
  #fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }
  /* Parlayan nokta imleç (sadece fare olan cihazlarda) */
  #dot {
    position: fixed;
    top: 0;
    left: 0;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: var(--white);
    box-shadow:
      0 0 6px 2px rgba(255,255,255,.9),
      0 0 14px 5px rgba(255,105,180,.85),
      0 0 30px 10px rgba(255,105,180,.45);
    pointer-events: none;
    z-index: 30;
    opacity: 0;
    transition: opacity .2s, scale .15s;
  }
  #dot.on { opacity: 1; }
  #dot.press { scale: .6; }
  @media (pointer: fine) {
    body { cursor: none; }
  }
  @media (pointer: coarse) {
    #dot { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    pre { animation: none; transform: none; }
  }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="vignette"></div>

<main class="stage">
  <pre id="title" aria-label="TACHI"></pre>
  <pre class="line" id="o1"><b>OWNER OF </b>TACHI : RUNO</pre>
  <pre class="line" id="o2"><b>OWNER OF </b>TACHI : DEJARES</pre>
  <pre class="line" id="dv"><b>DEVELOPED BY </b>RYN</pre>
</main>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="dot" aria-hidden="true"></div>

<audio id="bgm" src="song.mp3" loop preload="auto"></audio>
<div id="gate" role="button" tabindex="0" aria-label="Girmek için tıkla"><span>GİRMEK İÇİN TIKLA</span></div>
<button id="mute" type="button" hidden aria-label="Müziği aç veya kapat">♪ AÇIK</button>

<script>
  /* ---------- Başlık (# harfleri) ---------- */
  const F = {
    T: ["###########","###########","    ###    ","    ###    ","    ###    ","    ###    ","    ###    ","    ###    "],
    A: ["    ###    ","   #####   ","  ### ###  "," ###   ### "," ######### ","###     ###","###     ###","###     ###"],
    C: ["###########","###########","###        ","###        ","###        ","###        ","###########","###########"],
    H: ["###     ###","###     ###","###     ###","###########","###########","###     ###","###     ###","###     ###"],
    I: ["###########","###########","    ###    ","    ###    ","    ###    ","    ###    ","###########","###########"]
  };
  const rows = [];
  for (let r = 0; r < 8; r++) {
    rows.push([..."TACHI"].map(ch => F[ch][r]).join("   "));
  }
  document.getElementById("title").textContent = rows.join("\n");

  /* ---------- Arka plan: akan harfler ---------- */
  (function () {
    const canvas = document.getElementById("rain");
    const ctx = canvas.getContext("2d");
    const CHARS = "TACHI#TACHI#0123456789ABDEJLNOPRSUVWY";
    const SIZE = 16;
    const BG = "12,12,12";
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

    let cols, drops, speeds, w, h;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = `rgb(${BG})`;
      ctx.fillRect(0, 0, w, h);
      ctx.font = `${SIZE}px Consolas, "Courier New", monospace`;
      cols = Math.ceil(w / SIZE);
      drops = Array.from({ length: cols }, () => Math.random() * -h / SIZE);
      speeds = Array.from({ length: cols }, () => 0.35 + Math.random() * 0.55);
    }

    function step() {
      // önceki kareyi yavaşça karart, iz bırakır
      ctx.fillStyle = `rgba(${BG},0.09)`;
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < cols; i++) {
        const y = drops[i] * SIZE;
        if (y > 0) {
          const ch = CHARS[(Math.random() * CHARS.length) | 0];
          // baştaki harf beyaz, arkası pembe
          ctx.fillStyle = "#ffffff";
          ctx.fillText(ch, i * SIZE, y);
          ctx.fillStyle = "rgba(255,105,180,.9)";
          ctx.fillText(CHARS[(Math.random() * CHARS.length) | 0], i * SIZE, y - SIZE);
        }
        drops[i] += speeds[i];
        if (y > h && Math.random() > 0.975) {
          drops[i] = 0;
          speeds[i] = 0.35 + Math.random() * 0.55;
        }
      }
    }

    resize();
    addEventListener("resize", resize);
    if (reduced) return;

    // ~30 fps, sekme gizliyken durur
    let last = 0;
    function loop(t) {
      if (t - last > 33) { step(); last = t; }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();

  /* ---------- Giriş ekranı + müzik ---------- */
  (function () {
    const gate = document.getElementById("gate");
    const bgm = document.getElementById("bgm");
    const btn = document.getElementById("mute");
    const VOLUME = 0.5;          // 0 ile 1 arası, sesi buradan ayarla
    let entered = false, broken = false;

    bgm.addEventListener("error", () => { broken = true; btn.hidden = true; });

    function enter() {
      if (entered) return;
      entered = true;
      gate.classList.add("out");
      document.body.classList.add("go");     // yazılar kaymaya başlar

      bgm.volume = 0;
      const p = bgm.play();
      if (p && p.catch) p.catch(() => { btn.hidden = true; });
      if (!broken) btn.hidden = false;

      // sesi 2 saniyede yavaşça aç
      const t0 = performance.now();
      (function fade(t) {
        const k = Math.min(1, (t - t0) / 2000);
        bgm.volume = VOLUME * k;
        if (k < 1) requestAnimationFrame(fade);
      })(t0);
    }

    gate.addEventListener("click", enter);
    gate.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enter(); }
    });

    btn.addEventListener("click", () => {
      bgm.muted = !bgm.muted;
      btn.textContent = bgm.muted ? "♪ KAPALI" : "♪ AÇIK";
    });
  })();

  /* ---------- Tıklayınca parçacık patlaması ---------- */
  (function () {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    const c = document.getElementById("fx");
    const ctx = c.getContext("2d");
    const GLYPHS = "###TACHI";
    const particles = [];
    let w, h, running = false;

    function size() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      c.width = w * dpr;
      c.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    addEventListener("resize", size);

    function burst(x, y) {
      const count = 3 + (Math.random() < 0.5 ? 1 : 0);   // 3-4 parçacık
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1.5 + Math.random() * 4.5;
        particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s - 1,
          life: 1,
          decay: 0.014 + Math.random() * 0.02,
          size: 14 + Math.random() * 12,
          ch: GLYPHS[(Math.random() * GLYPHS.length) | 0],
          col: Math.random() < 0.55 ? "255,105,180" : "255,255,255"
        });
      }
      if (!running) { running = true; requestAnimationFrame(tick); }
    }

    function tick() {
      ctx.clearRect(0, 0, w, h);
      ctx.shadowColor = "rgba(255,105,180,.8)";
      ctx.shadowBlur = 8;
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.97;
        p.vy = p.vy * 0.97 + 0.09;   // hafif yerçekimi
        p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = `rgb(${p.col})`;
        ctx.font = `${p.size}px Consolas, "Courier New", monospace`;
        ctx.fillText(p.ch, p.x, p.y);
      }
      ctx.globalAlpha = 1;
      if (particles.length) {
        requestAnimationFrame(tick);
      } else {
        running = false;
        ctx.clearRect(0, 0, w, h);
      }
    }

    addEventListener("pointerdown", e => {
      if (e.target.closest && e.target.closest("#mute")) return;
      burst(e.clientX, e.clientY);
    });
  })();

  /* ---------- Parlayan nokta imleç ---------- */
  (function () {
    const dot = document.getElementById("dot");
    addEventListener("pointermove", e => {
      if (e.pointerType !== "mouse") return;
      dot.style.translate = `${e.clientX}px ${e.clientY}px`;
      dot.classList.add("on");
    });
    addEventListener("pointerdown", () => dot.classList.add("press"));
    addEventListener("pointerup", () => dot.classList.remove("press"));
    document.addEventListener("mouseleave", () => dot.classList.remove("on"));
  })();
</script>
</body>
</html>
